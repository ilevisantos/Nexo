<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="#">
            <div class="logo"><img src="assets/logo-black.png" alt="logo-nexo"><h3>Nexo</h3></div>
            </a>
            <nav>
                <ul>
                    <li><a href="#">Resumo</a></li>
                    <li><a href="#">Transações</a></li>
                    <li><a href="#">Contas</a></li>
                    <li><a href="#">Investimentos</a></li>
                </ul>
            </nav>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <button id="add_receita" aria-label="Add Receita">+Receita</button>
                <button id="add_despesa" aria-label="Add Despesa">+Despesa</button>
                <button class="menu-config" aria-label="Toggle Menu">☰</button>
            </header>

            <main class="content">
                <section class="resumo">
                    <div class="card card-recebido">
                        <span>Recebido</span>
                        <h3 id="valor-recebido">R$ 0,00</h3>
                    </div>
                    <div class="card card-despesa">
                        <span>Despesas</span>
                        <h3 id="valor-despesas">R$ 0,00</h3>
                    </div>
                    <div class="card card-saldo">
                        <span>Saldo</span>
                        <h3 id="valor-saldo">R$ 0,00</h3>
                    </div>
                </section>

                <section class="overview">
                    <div class="card">
                        <h2>Histórico/Projeção de Transações</h2>
                        
                    </div>

                    <div class="card">
                        <h2>Contas e Cartões</h2>
                    </div>
                </section>

                <section class="transacoes">
                    <div class="card">
                        <div class="transacoes-header">
                            <h2>Transações Recentes</h2>
                            <a href="#">Ver tudo ➜</a>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col">Data</th>
                                    <th scope="col">Pagamento</th>
                                    <th scope="col">Classificação</th>
                                    <th scope="col">Conta</th>
                                    <th scope="col">Valor</th>
                                </tr>
                            </thead>
                            <tbody id="lista-transacoes">
                                <!-- As transações serão renderizadas aqui pelo JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2 class="modal-title">Adicionar Transação</h2>
                    <button class="close-modal" aria-label="Fechar Modal">&#10060;</button>
                </div>
                
                <form class="form-transacao">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome da transação">
                        <small class="erro-campo" id="erro-nome"></small>
                    </div>

                    <div class="form-group">
                        <label for="valor">Valor</label>
                        <input type="number" id="valor" name="valor" placeholder="Digite o valor da transação">
                        <small class="erro-campo" id="erro-valor"></small>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            list="categorias"
                        >
                        <datalist id="categorias">
                            <option value="Alimentação">
                            <option value="Transporte">
                            <option value="Setup">
                            <option value="Assinatura">
                        </datalist>
                        <small class="erro-campo" id="erro-categoria"></small>
                    </div>

                    <div class="form-group campo-classificacao">
                        <label for="classificacao">Classificação</label>
                        <select id="classificacao" name="classificacao">
                            <option value="">Selecione...</option>
                            <option value="Essencial">Essencial / Necessidade</option>
                            <option value="Desejo">Desejo</option>
                            <option value="Investimento">Investimento</option>
                            <option value="Imprevisto">Imprevisto</option>
                            <option value="Desnecessario">Desnecessário</option>
                        </select>
                        <small class="erro-campo" id="erro-classificacao"></small>
                    </div>
                    
                    <div class="form-group campo-pagamento hidden">
                        <label for="pagamento">Forma de Pagamento</label>
                        <select id="pagamento" name="pagamento">
                            <option value="">Selecione...</option>
                            <option value="Pix">Pix</option>
                            <option value="Credito">Crédito</option>
                            <option value="Debito">Débito</option>
                            <option value="Boleto">Boleto</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="Outro">Outro</option>
                        </select>
                        <small class="erro-campo" id="erro-pagamento"></small>
                    </div>

                    <div class="form-group">
                        <label for="conta">Conta</label>
                        <select id="conta" name="conta">
                            <option value="">Selecione uma conta...</option>
                            <option value="Nubank">Nubank</option>
                            <option value="Bradesco">Bradesco</option>
                            <option value="Inter">Inter</option>
                        </select>
                        <small class="erro-campo" id="erro-conta"></small>
                    </div>

                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" id="data" name="data">
                        <small class="erro-campo" id="erro-data"></small>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="cancel-modal">Cancelar</button>
                        <button type="submit" class="save-modal">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
