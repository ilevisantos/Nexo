<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <nav>
                <ul>
                    <li><a href="#">Resumo</a></li>
                    <li><a href="#">Transações</a></li>
                    <li><a href="#">Contas</a></li>
                    <li><a href="#">Investimentos</a></li>
                </ul>
            </nav>
        </aside>

        <header class="topbar">
            <a href="#" class="logo" >Nexo</a>
            <button class="add-receita" aria-label="Add Receita">+Receita</button>
            <button class="add-despesa" aria-label="Add Despesa">+Despesa</button>
            <button class="menu-config" aria-label="Toggle Menu">☰</button>
        </header>

        <main class="content">
            <section class="resumo">
                <article class="recebido">
                    <h3>Recebido</h3>
                    <p id="valor-recebido">R$ 0,00</p>
                </article>
                <article class="despesas">
                    <h3>Despesas</h3>
                    <p id="valor-despesas">R$ 0,00</p>
                </article>
                <article class="saldo">
                    <h3>Saldo</h3>
                    <p id="valor-saldo">R$ 0,00</p>
                </article>
            </section>

            <section class="historico">
                <h2>Histórico/Projeção de Transações</h2>
                
            </section>

            <section class="contas">
                <h2>Contas e Cartões</h2>
            </section>

            <section class="transacoes">
                <h2>Transações Recentes</h2>
            </section>
        </main>
        
    </div>
</body>
</html>
